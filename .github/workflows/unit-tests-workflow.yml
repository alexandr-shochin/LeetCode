name: unit tests workflow

on:
  workflow_run:
    workflows: [ build workflow ]
    types:
      - completed

env:
  DOTNET_VERSION: '8.0.112'

jobs:
  unit-tests:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    name: unit-tests-${{matrix.os}}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ ubuntu-latest, windows-latest, macOS-latest ]

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Setup .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install dependencies
        run: dotnet restore

      - name: Test
        run: dotnet test --no-restore --verbosity normal --collect:"XPlat Code Coverage" --results-directory ./coverage

      - name: Add coverage summary
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          dotnet tool install -g dotnet-reportgenerator-globaltool
          export PATH="$PATH:$HOME/.dotnet/tools"
          reportgenerator '-reports:./coverage/**/coverage.cobertura.xml' -targetdir:./coverage/report -reporttypes:"MarkdownSummaryGithub;TextSummary"
          cat ./coverage/report/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}
          path: ./coverage/**/coverage.cobertura.xml
          if-no-files-found: warn
